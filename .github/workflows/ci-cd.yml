name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24.x'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client deps
        run: npm ci
        working-directory: ./client

      - name: Install server deps
        run: npm ci
        working-directory: ./server

      - name: Lint client
        run: npm run lint
        working-directory: ./client

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client deps
        run: npm ci
        working-directory: ./client

      - name: Install server deps
        run: npm ci
        working-directory: ./server

      - name: Run client unit tests
        run: npm test -- --run
        working-directory: ./client

      - name: Run server unit tests
        run: npm test -- --run
        working-directory: ./server

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    if: vars.RUN_E2E == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client deps
        run: npm ci
        working-directory: ./client

      - name: Install server deps
        run: npm ci
        working-directory: ./server

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: ./client

      - name: Run E2E tests
        run: npx playwright test
        working-directory: ./client
        env:
          CI: true
          MONGODB_URI: ${{ secrets.E2E_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always() && needs.test.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client deps
        run: npm ci
        working-directory: ./client

      - name: Install server deps
        run: npm ci
        working-directory: ./server

      - name: Build client
        run: npm run build
        working-directory: ./client

      - name: Verify server starts
        run: node --check server.js
        working-directory: ./server

      - name: Deploy to Vercel (client)
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_VERCEL == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./client
